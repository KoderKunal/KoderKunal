name: AgentGuard validation
on:
  push:
    paths:
      - 'analytics-ai-consulting-portfolio/agentguard/**'
  pull_request:
    paths:
      - 'analytics-ai-consulting-portfolio/agentguard/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-ai-consulting-portfolio/agentguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile risk_engine.py app.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
