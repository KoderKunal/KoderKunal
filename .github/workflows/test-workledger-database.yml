name: WorkLedger database migration smoke test
on:
  push:
    paths:
      - 'employee-ops-portal/supabase/**'
      - '.github/workflows/test-workledger-database.yml'
  pull_request:
    paths:
      - 'employee-ops-portal/supabase/**'
      - '.github/workflows/test-workledger-database.yml'
jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create minimal Supabase Auth test stubs
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d workledger_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb
          );
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE
          AS $fn$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $fn$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Apply WorkLedger migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d workledger_test -v ON_ERROR_STOP=1 \
            -f employee-ops-portal/supabase/migrations/0001_initial_schema.sql
